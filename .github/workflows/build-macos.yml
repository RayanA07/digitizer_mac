name: Build macOS 2.15

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests + CLI smoke test (macOS)
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: |
          brew update
          brew install tesseract
          tesseract --version

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Digitizer/requirements.txt -r Digitizer/requirements-dev.txt
          python3 -m pip install -r AccuracyTester/requirements.txt -r AccuracyTester/requirements-dev.txt

      - name: Digitizer unit tests
        run: cd Digitizer && python3 -m pytest -q

      - name: AccuracyTester unit tests
        run: cd AccuracyTester && python3 -m pytest -q

      - name: CLI help must not print Windows paths
        run: bash tools/check_help_text.sh

      - name: End-to-end smoke test (digitize a folder, then score it)
        run: python3 tools/smoke_test.py

  build:
    name: macOS Tahoe build
    runs-on: macos-26
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Homebrew packages
        run: |
          brew update
          brew install tesseract dylibbundler

      - name: Build Digitizer.app
        run: |
          cd Digitizer
          bash build_macos.sh

      - name: Build AccuracyTester.app
        run: |
          cd AccuracyTester
          bash build_macos.sh

      - name: Upload Digitizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digitizer-macos
          path: Digitizer/dist/*.zip

      - name: Upload AccuracyTester artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccuracyTester-macos
          path: AccuracyTester/dist/*.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Data Digitizer 2.15 (macOS)
          body_path: RELEASE_NOTES.md
          files: |
            Digitizer/dist/*.zip
            AccuracyTester/dist/*.zip
